<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anverum | Curiosity should always be free.</title>
    <meta name="description" content="Anverum is a place for questions worth wondering about.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">ANVERUM</a>
        <span class="tagline">Curiosity should always be free.</span>

    <main class="home">
        <section class="hero">
            <p class="eyebrow">A place for questions</p>
            <a href="#" id="why-button" class="why-button" aria-label="Discover a random question">
    Why?
</a>

        </section>

        <section class="question-section">
            <div class="section-heading">
                <span>WONDER</span>
                <span id="article-count"></span>
            </div>
            <div id="articles" class="article-grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <span>Curiosity should always be free.</span>
        <span>ANVERUM</span>
    </footer>

    <script src="js/main.js"></script>

</html>
